name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          import re
          from datetime import datetime, timedelta, timezone

          USERNAME = "kishanbm19"

          headers = {
              "Authorization": "Bearer " + __import__("os").environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-stats"
          }

          def github_api(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          # -----------------------------
          # USER DATA
          # -----------------------------

          user = github_api(
              f"https://api.github.com/users/{USERNAME}"
          )

          repositories = user["public_repos"]
          followers = user["followers"]

          # -----------------------------
          # REPOSITORIES / STARS
          # -----------------------------

          repos = []
          page = 1

          while True:
              data = github_api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
          )

          # -----------------------------
          # CONTRIBUTION CALENDAR
          # -----------------------------

          contribution_url = (
              f"https://github.com/users/"
              f"{USERNAME}/contributions"
          )

          request = urllib.request.Request(
              contribution_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request) as response:
              html = response.read().decode()

          contributions = {}

          matches = re.findall(
              r'data-date="([^"]+)"[^>]*data-count="([^"]+)"',
              html
          )

          for date, count in matches:
              try:
                  contributions[date] = int(count)
              except:
                  pass

          # -----------------------------
          # CURRENT STREAK
          # -----------------------------

          today = datetime.now(timezone.utc).date()

          current_streak = 0
          day = today

          while contributions.get(day.isoformat(), 0) > 0:
              current_streak += 1
              day -= timedelta(days=1)

          # -----------------------------
          # LONGEST STREAK
          # -----------------------------

          longest_streak = 0
          running = 0

          if contributions:

              start = min(contributions.keys())
              end = max(contributions.keys())

              start_date = datetime.strptime(
                  start,
                  "%Y-%m-%d"
              ).date()

              end_date = datetime.strptime(
                  end,
                  "%Y-%m-%d"
              ).date()

              day = start_date

              while day <= end_date:

                  if contributions.get(
                      day.isoformat(), 0
                  ) > 0:

                      running += 1
                      longest_streak = max(
                          longest_streak,
                          running
                      )

                  else:
                      running = 0

                  day += timedelta(days=1)

          # -----------------------------
          # ESCAPE SVG TEXT
          # -----------------------------

          def escape(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )

          def text(
              x,
              y,
              value,
              size=16,
              weight="normal",
              color="#ffffff"
          ):
              return (
                  f'<text x="{x}" y="{y}" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="{size}px" '
                  f'font-weight="{weight}" '
                  f'fill="{color}">'
                  f'{escape(value)}</text>'
              )

          # -----------------------------
          # CREATE STATS CARD
          # -----------------------------

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="600"
          height="260">

          <rect
              width="600"
              height="260"
              rx="12"
              fill="#0d1117"/>

          {text(
              30, 45,
              "GitHub Stats",
              26,
              "bold"
          )}

          {text(
              30, 85,
              "Public Repositories",
              14,
              "normal",
              "#8b949e"
          )}

          {text(
              30, 112,
              repositories,
              22,
              "bold"
          )}

          {text(
              220, 85,
              "Total Stars",
              14,
              "normal",
              "#8b949e"
          )}

          {text(
              220, 112,
              stars,
              22,
              "bold"
          )}

          {text(
              410, 85,
              "Followers",
              14,
              "normal",
              "#8b949e"
          )}

          {text(
              410, 112,
              followers,
              22,
              "bold"
          )}

          {text(
              30, 160,
              "🔥 Current Streak",
              15,
              "normal",
              "#8b949e"
          )}

          {text(
              30, 195,
              f"{current_streak} days",
              24,
              "bold"
          )}

          {text(
              320, 160,
              "🏆 Longest Streak",
              15,
              "normal",
              "#8b949e"
          )}

          {text(
              320, 195,
              f"{longest_streak} days",
              24,
              "bold"
          )}

          {text(
              30, 235,
              "Automatically updated",
              12,
              "normal",
              "#6e7681"
          )}

          </svg>'''

          with open(
              "github-stats.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("================================")
          print("GitHub Stats Updated")
          print("================================")
          print("Repositories:", repositories)
          print("Stars:", stars)
          print("Followers:", followers)
          print("Current Streak:", current_streak)
          print("Longest Streak:", longest_streak)
          print("================================")

          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg

          git diff --cached --quiet || \
            git commit -m "Update GitHub stats"

          git push
